<div class="bg-[var(--bg-base)] min-h-screen text-white pb-24 font-sans">
  <!-- Header Section -->
  <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-10 pt-12 pb-8 text-center">
    <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">
      {{ 'faqPage.title' | translate }}
    </h1>
    <p class="text-xs sm:text-sm text-muted/90 max-w-2xl mx-auto leading-relaxed">
      {{ 'faqPage.subtitle' | translate }}
    </p>
  </section>
  <!-- Categorized FAQ Accordion Grids -->
  <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-10 py-6 space-y-10">
    @for (cat of arrCategories; track cat.idCategory) {
      <div>
        <!-- Category Title Bar -->
        <div
          class="bg-gradient-to-r from-[#161824] via-[#12141D] to-[#0A0B0E] border border-white/15 px-6 py-3.5 rounded-xl mb-4 flex items-center gap-3 shadow-md"
        >
          <span class="w-2 h-2 rounded-full bg-gold"></span>
          <h2 class="text-sm sm:text-base font-extrabold tracking-wide text-white">
            {{ cat.titleKey | translate }}
          </h2>
        </div>
        <!-- 2-Column Grid of Accordion Items -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          @for (item of cat.items; track item.id) {
            <div
              class="bg-[var(--bg-elevated)] border border-[var(--border-subtle)] rounded-xl overflow-hidden transition-all duration-300 hover:border-[var(--border-medium)] shadow-md"
            >
              <!-- Question Toggle Header -->
              <button
                type="button"
                (click)="fnToggleItem(item.id)"
                class="w-full px-5 py-4 flex items-center justify-between text-start gap-4 text-xs sm:text-sm font-extrabold text-white/90 hover:text-gold transition-colors cursor-pointer"
              >
                <span class="leading-snug">{{ item.qKey | translate }}</span>
                <span
                  class="w-6 h-6 rounded-full bg-surface border border-white/15 flex items-center justify-center text-xs text-gold shrink-0 font-mono transition-transform duration-200"
                  [class.rotate-45]="blnIsOpen(item.id)"
                >
                  +
                </span>
              </button>
              <!-- Answer Body (Accordion Content) -->
              @if (blnIsOpen(item.id)) {
                <div
                  class="px-5 pb-4 pt-2 text-xs text-muted/90 leading-relaxed border-t border-white/5 bg-surface/30"
                >
                  {{ item.aKey | translate }}
                </div>
              }
            </div>
          }
        </div>
      </div>
    }
  </section>
</div>
