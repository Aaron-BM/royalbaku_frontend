@if (strWhatsappHref() || strPhoneHref()) {
  <div
    class="fixed bottom-5 right-5 sm:bottom-6 sm:right-6 z-[9999] flex flex-col items-center gap-3.5 pointer-events-auto select-none"
    aria-label="Floating Contact Actions"
  >
    <!-- WhatsApp Floating Action Button (Top) -->
    @if (strWhatsappHref()) {
      <a
        [href]="strWhatsappHref()"
        target="_blank"
        rel="noopener noreferrer"
        class="group relative flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-tr from-[#1EBE57] to-[#25D366] text-white shadow-[0_10px_25px_rgba(37,211,102,0.4)] border border-white/20 hover:scale-110 active:scale-95 transition-all duration-300 ease-out cursor-pointer"
        aria-label="Contact us on WhatsApp"
        title="Chat on WhatsApp"
      >
        <app-icon-whatsapp class="w-6 h-6 sm:w-7 sm:h-7 fill-current transition-transform duration-300 group-hover:rotate-6" />

        <!-- Tooltip Label on Hover (Desktop) -->
        <span
          class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg bg-[#0A0C0E] text-white text-xs font-medium border border-white/10 shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap pointer-events-none hidden sm:block"
        >
          WhatsApp Us
        </span>
      </a>
    }

    <!-- Phone / Call Floating Action Button (Bottom) -->
    @if (strPhoneHref()) {
      <a
        [href]="strPhoneHref()"
        class="group relative flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-tr from-[#B38318] via-[#D9A326] to-[#F5D061] text-black shadow-[0_10px_25px_rgba(217,163,38,0.4)] border border-white/30 hover:scale-110 active:scale-95 transition-all duration-300 ease-out cursor-pointer"
        aria-label="Call us"
        title="Call Us Now"
      >
        <app-icon-phone class="w-5 h-5 sm:w-6 sm:h-6 transition-transform duration-300 group-hover:-rotate-12" [numStrokeWidth]="2.2" />

        <!-- Tooltip Label on Hover (Desktop) -->
        <span
          class="absolute right-full mr-3 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg bg-[#0A0C0E] text-white text-xs font-medium border border-white/10 shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap pointer-events-none hidden sm:block"
        >
          Call Us
        </span>
      </a>
    }
  </div>
}
