<main class="min-h-[70vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-16 sm:py-24 font-sans text-white">
  <div class="max-w-xl w-full text-center space-y-8">
    <!-- 404 Visual Glow Badge -->
    <div class="relative inline-flex items-center justify-center">
      <div class="absolute -inset-4 rounded-full bg-gold/20 blur-2xl animate-pulse"></div>
      <span class="relative text-7xl sm:text-9xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-white via-amber-200 to-gold drop-shadow-lg">
        404
      </span>
    </div>

    <!-- Message & Description -->
    <div class="space-y-3">
      <h1 class="text-2xl sm:text-4xl font-extrabold tracking-wide text-white">
        {{ 'notfound.title' | translate }}
      </h1>
      <p class="text-sm sm:text-base text-muted/80 max-w-md mx-auto leading-relaxed">
        {{ 'notfound.subtitle' | translate }}
      </p>
    </div>

    <!-- Back to Home CTA Button -->
    <div>
      <a
        [routerLink]="'/' | langUrl"
        class="inline-flex items-center gap-2.5 px-8 py-3.5 rounded-xl bg-gold hover:bg-amber-400 text-black font-extrabold text-sm tracking-wide transition-all duration-200 shadow-xl shadow-gold/10 hover:scale-[1.02] active:scale-95 outline-none focus-visible:ring-2 focus-visible:ring-gold/50"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>{{ 'notfound.backHome' | translate }}</span>
      </a>
    </div>
  </div>
</main>
