<article
  [routerLink]="['/blog', objPost.strSlug] | langUrl"
  class="luxury-card-hover bg-[var(--bg-elevated)] border border-[var(--border-subtle)] rounded-2xl overflow-hidden shadow-lg relative flex flex-col group transition-all duration-300 h-full cursor-pointer"
>
  <!-- Cover Image -->
  <div class="relative overflow-hidden h-44 sm:h-52 shrink-0">
    <img
      [src]="objPost.strCoverImage"
      [alt]="objPost.strTitle"
      width="640"
      height="360"
      loading="lazy"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
    />
    <!-- Gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-[var(--bg-elevated)] via-transparent to-transparent opacity-80"></div>

    <!-- Category badge -->
    @if (objPost.strCategory) {
      <span
        class="absolute top-3 left-3 bg-gold/90 text-black text-[9px] font-extrabold tracking-widest px-2.5 py-1 rounded-full uppercase shadow-md"
      >
        {{ objPost.strCategory }}
      </span>
    }
  </div>

  <!-- Card Body -->
  <div class="p-5 flex flex-col flex-1 bg-[var(--bg-elevated)]">
    <!-- Meta row: date + reading time -->
    <div class="flex items-center gap-3 text-[10px] text-muted/70 font-normal mb-3">
      <span>{{ fnFormatDate(objPost.strPublishedAt) }}</span>
      @if (objPost.numReadingTime) {
        <span class="flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          {{ objPost.numReadingTime }} {{ 'blog.minRead' | translate }}
        </span>
      }
    </div>

    <!-- Title -->
    <h3 class="text-sm sm:text-base font-bold text-white leading-snug group-hover:text-gold transition-colors mb-2">
      {{ objPost.strTitle }}
    </h3>

    <!-- Excerpt -->
    <p class="text-[11px] text-muted/80 font-normal leading-relaxed line-clamp-3 flex-1">
      {{ objPost.strExcerpt }}
    </p>

    <!-- Read more link -->
    <span
      class="mt-4 inline-flex items-center gap-1.5 text-xs font-semibold text-gold group-hover:gap-2.5 transition-all"
    >
      {{ 'blog.readMore' | translate }}
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
      </svg>
    </span>
  </div>
</article>
