<div class="relative inline-block w-full" #containerRef>
  <!-- Trigger Button -->
  <button
    #triggerBtnRef
    type="button"
    [class]="strMergedButtonClass()"
    [disabled]="blnDisabled()"
    (click)="fnToggleDropdown()"
    (keydown)="fnOnKeydown($event)"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="blnIsOpen()"
    [attr.aria-controls]="strListboxId"
    [attr.aria-label]="strAriaLabel || ('common.selectCountryCode' | translate)"
  >
    <span class="flex items-center gap-1.5 min-w-0 truncate">
      @if (objCurrentCountry()?.flag) {
        <span class="text-sm shrink-0 leading-none" aria-hidden="true">{{ objCurrentCountry()?.flag }}</span>
      }
      <span class="truncate">{{ objCurrentCountry()?.dial_code || strCurrentDialCode() }}</span>
    </span>
    <svg
      class="chevron-icon w-3 h-3 text-white/50 shrink-0 transition-transform duration-200"
      [class.rotate-180]="blnIsOpen()"
      aria-hidden="true"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Popover List -->
  @if (blnIsOpen()) {
    <div
      #listboxRef
      role="listbox"
      [id]="strListboxId"
      tabindex="-1"
      class="country-dropdown-list absolute z-50 min-w-[230px] sm:min-w-[250px] max-w-[calc(100vw-32px)] max-h-[260px] overflow-y-auto bg-[#12141C] border border-white/15 rounded-xl shadow-[0_16px_40px_rgba(0,0,0,0.85),0_0_20px_rgba(207,174,61,0.1)] p-1 text-xs text-white backdrop-blur-xl dropdown-animate"
      [class.bottom-full]="blnOpenUpward()"
      [class.mb-1.5]="blnOpenUpward()"
      [class.top-full]="!blnOpenUpward()"
      [class.mt-1.5]="!blnOpenUpward()"
      [class.left-0]="strAlign === 'left'"
      [class.right-0]="strAlign === 'right'"
      (keydown)="fnOnKeydown($event)"
    >
      @for (c of arrCountryList(); track c.code; let i = $index) {
        <div
          role="option"
          [id]="strListboxId + '-' + c.code"
          [attr.aria-selected]="c.code === strSelectedIsoCode()"
          class="flex items-center justify-between gap-2.5 px-3 py-2 rounded-lg cursor-pointer transition-colors select-none text-left"
          [class.bg-gold/20]="c.code === strSelectedIsoCode()"
          [class.text-gold]="c.code === strSelectedIsoCode()"
          [class.font-semibold]="c.code === strSelectedIsoCode()"
          [class.bg-white/5]="i === numHighlightedIndex() && c.code !== strSelectedIsoCode()"
          (click)="fnSelectCountry(c)"
          (mouseenter)="numHighlightedIndex.set(i)"
        >
          <div class="flex items-center gap-2 min-w-0">
            @if (c.flag) {
              <span class="text-sm shrink-0 leading-none" aria-hidden="true">{{ c.flag }}</span>
            }
            <span class="truncate">{{ c.name }}</span>
          </div>
          <span
            class="text-white/60 font-mono text-[11px] shrink-0 ltr:ml-auto rtl:mr-auto"
            [class.text-gold]="c.code === strSelectedIsoCode()"
          >
            {{ c.dial_code }}
          </span>
        </div>
      }
    </div>
  }
</div>
