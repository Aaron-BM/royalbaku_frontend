<div
  class="max-w-6xl mx-auto space-y-8"
  role="status"
  aria-busy="true"
  aria-live="polite"
>
  <!-- Screen reader accessible loading text -->
  <span class="sr-only">{{ 'carDetail.loading' | translate }}</span>

  <!-- Vehicle Hero Header Placeholder -->
  <header class="space-y-4" aria-hidden="true">
    <!-- Breadcrumbs & Badges -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <!-- Breadcrumb bar -->
      <div class="flex items-center gap-2">
        <div class="h-4 w-12 rounded bg-white/10 skeleton-pulse"></div>
        <span class="text-white/20">/</span>
        <div class="h-4 w-16 rounded bg-white/10 skeleton-pulse"></div>
        <span class="text-white/20">/</span>
        <div class="h-4 w-28 rounded bg-white/15 skeleton-pulse"></div>
      </div>
      <!-- Badges -->
      <div class="flex items-center gap-2">
        <div class="h-6 w-20 rounded-full bg-white/10 skeleton-pulse"></div>
        <div class="h-6 w-24 rounded-full bg-white/10 skeleton-pulse"></div>
        <div class="h-6 w-32 rounded-full bg-gold/15 border border-gold/20 skeleton-pulse"></div>
      </div>
    </div>

    <!-- Grand Model Title & Quick Info Bar -->
    <div class="pt-1 border-b border-white/10 pb-4 space-y-2.5">
      <div class="h-10 sm:h-12 w-64 sm:w-96 rounded-xl bg-white/15 skeleton-pulse"></div>
      <div class="flex items-center gap-2">
        <div class="h-4 w-36 rounded bg-emerald-400/20 skeleton-pulse"></div>
        <span class="text-white/20">•</span>
        <div class="h-4 w-48 rounded bg-white/10 skeleton-pulse"></div>
      </div>
    </div>
  </header>

  <!-- Top Grid: Gallery (Left 7 Cols) & Specs/Price (Right 5 Cols) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6" aria-hidden="true">
    <!-- Left Column: Main Image Slider + Thumbnails -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      <!-- Main Display Image Box -->
      <div
        class="bg-gradient-to-b from-[#151821] via-[#0E1017] to-[#07080B] rounded-2xl h-80 sm:h-[400px] border border-white/10 relative overflow-hidden shadow-2xl flex items-center justify-center"
      >
        <div class="w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/20 skeleton-pulse">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
      </div>

      <!-- 5 Thumbnail Placeholders -->
      <div class="grid grid-cols-5 gap-2">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="h-14 sm:h-16 rounded-xl bg-white/5 border border-white/10 skeleton-pulse"></div>
        }
      </div>
    </div>

    <!-- Right Column: Rate Card, Specs & Actions -->
    <div class="lg:col-span-5 flex flex-col gap-5">
      <div class="bg-[var(--bg-elevated)] border border-[var(--border-subtle)] rounded-2xl p-5 sm:p-6 shadow-xl space-y-5">
        <!-- Daily Rate Strip -->
        <div class="border-b border-white/10 pb-4 space-y-1.5">
          <div class="h-3 w-12 rounded bg-white/10 skeleton-pulse"></div>
          <div class="flex items-baseline gap-2">
            <div class="h-8 sm:h-10 w-28 rounded-lg bg-gold/20 skeleton-pulse"></div>
            <div class="h-4 w-12 rounded bg-white/10 skeleton-pulse"></div>
          </div>
          <!-- Monthly placeholder -->
          <div class="flex gap-4 pt-1">
            <div class="h-4 w-28 rounded bg-white/10 skeleton-pulse"></div>
          </div>
        </div>

        <!-- Specifications Grid Placeholder (2 cols x 4 rows) -->
        <div class="grid grid-cols-2 gap-x-4 gap-y-3">
          @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
            <div class="flex items-center justify-between py-1 border-b border-white/5">
              <div class="h-3.5 w-16 rounded bg-white/10 skeleton-pulse"></div>
              <div class="h-3.5 w-14 rounded bg-white/15 skeleton-pulse"></div>
            </div>
          }
        </div>

        <!-- 3 CTA Action Buttons Placeholder -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-2">
          <div class="h-10 rounded-full bg-emerald-500/20 border border-emerald-500/30 skeleton-pulse"></div>
          <div class="h-10 rounded-full bg-gold/20 border border-gold/30 skeleton-pulse"></div>
          <div class="h-10 rounded-full bg-white/15 border border-white/20 skeleton-pulse"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Grid: Left (Description & Documents) + Right (Booking Form) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start pt-6" aria-hidden="true">
    <!-- Left Column (7 cols): Overview & Documents Placeholders -->
    <div class="lg:col-span-7 space-y-6">
      <!-- Description Card Skeleton -->
      <div class="bg-[var(--bg-elevated)] border border-[var(--border-subtle)] rounded-2xl p-6 shadow-xl space-y-3">
        <div class="flex items-center gap-2.5 border-b border-[var(--border-subtle)] pb-3">
          <div class="w-8 h-8 rounded-lg bg-gold/10 skeleton-pulse"></div>
          <div class="h-5 w-36 rounded bg-white/15 skeleton-pulse"></div>
        </div>
        <div class="space-y-2 pt-1">
          <div class="h-3.5 w-full rounded bg-white/10 skeleton-pulse"></div>
          <div class="h-3.5 w-5/6 rounded bg-white/10 skeleton-pulse"></div>
          <div class="h-3.5 w-2/3 rounded bg-white/10 skeleton-pulse"></div>
        </div>
      </div>

      <!-- Documents Required Skeleton -->
      <div class="bg-[var(--bg-elevated)] border border-[var(--border-subtle)] rounded-2xl p-6 shadow-xl space-y-4">
        <div class="flex items-center gap-2.5 border-b border-[var(--border-subtle)] pb-3">
          <div class="w-8 h-8 rounded-lg bg-gold/10 skeleton-pulse"></div>
          <div class="h-5 w-40 rounded bg-white/15 skeleton-pulse"></div>
        </div>
        <div class="space-y-3 pt-1">
          <div class="flex items-center gap-3">
            <div class="w-6 h-6 rounded-full bg-gold/15 skeleton-pulse"></div>
            <div class="h-4 w-32 rounded bg-white/10 skeleton-pulse"></div>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-6 h-6 rounded-full bg-gold/15 skeleton-pulse"></div>
            <div class="h-4 w-44 rounded bg-white/10 skeleton-pulse"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column (5 cols): Booking Form Skeleton -->
    <div class="lg:col-span-5 bg-[var(--bg-elevated)] border border-[var(--border-subtle)] rounded-2xl p-6 shadow-xl space-y-4">
      <div class="border-b border-[var(--border-subtle)] pb-3 text-center">
        <div class="h-5 w-32 mx-auto rounded bg-white/15 skeleton-pulse"></div>
      </div>
      <div class="space-y-3">
        <div class="h-9 w-full rounded-lg bg-white/5 border border-white/10 skeleton-pulse"></div>
        <div class="h-9 w-full rounded-lg bg-white/5 border border-white/10 skeleton-pulse"></div>
        <div class="h-9 w-full rounded-lg bg-white/5 border border-white/10 skeleton-pulse"></div>
        <div class="h-9 w-full rounded-lg bg-white/5 border border-white/10 skeleton-pulse"></div>
        <div class="grid grid-cols-2 gap-2">
          <div class="h-9 rounded-lg bg-white/5 border border-white/10 skeleton-pulse"></div>
          <div class="h-9 rounded-lg bg-white/5 border border-white/10 skeleton-pulse"></div>
        </div>
        <div class="pt-2">
          <div class="h-10 w-full rounded-full bg-gold/25 skeleton-pulse"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Direct Vehicle Reservation Assistance Banner Placeholder -->
  <div class="pt-8 border-t border-white/10" aria-hidden="true">
    <div class="bg-[var(--bg-elevated)] border border-[var(--border-subtle)] rounded-3xl p-6 sm:p-8 lg:p-10 shadow-2xl space-y-4">
      <div class="h-5 w-40 rounded-full bg-gold/15 skeleton-pulse"></div>
      <div class="h-8 w-72 rounded-lg bg-white/15 skeleton-pulse"></div>
      <div class="h-4 w-96 max-w-full rounded bg-white/10 skeleton-pulse"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
        <div class="h-4 w-60 rounded bg-white/10 skeleton-pulse"></div>
        <div class="h-4 w-60 rounded bg-white/10 skeleton-pulse"></div>
        <div class="h-4 w-60 rounded bg-white/10 skeleton-pulse"></div>
        <div class="h-4 w-60 rounded bg-white/10 skeleton-pulse"></div>
      </div>
    </div>
  </div>
</div>
